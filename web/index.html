<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaintIRL</title>
<style>
  :root { --fg: #e9e6e1; --dim: #a19d97; --panel: rgba(32, 31, 30, 0.72); --line: rgba(255, 255, 255, 0.09) }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a1a; font: 12px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: var(--fg) }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block }
  #hud { position: fixed; left: 12px; top: 12px; background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
         border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px 7px 8px; user-select: none; max-width: calc(100vw - 48px) }
  .row { display: flex; align-items: center; gap: 2px; flex-wrap: wrap }
  button { background: none; border: 0; color: var(--fg); padding: 4px 5px; border-radius: 5px; cursor: pointer; display: grid; place-items: center }
  button:hover { background: rgba(255, 255, 255, 0.08) }
  button.on { background: rgba(255, 255, 255, 0.14) }
  button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px }
  #dry { display: none; gap: 10px; margin: 6px 0 2px 4px }
  #dry.open { display: flex }
  #dry input[type=range] { width: 180px; accent-color: #c9c4bc }
  #dry label { color: var(--dim); display: flex; align-items: center; gap: 4px }
  #dryGo { border: 1px solid var(--line); padding: 2px 12px; background: rgba(255, 255, 255, 0.08) }
  #dryVal { min-width: 56px }
  #status { color: var(--dim); margin: 4px 0 0 5px; font-size: 11px }
  #menu { position: fixed; display: none; background: rgba(40, 39, 38, 0.95); border: 1px solid var(--line); border-radius: 7px; padding: 4px; min-width: 190px; z-index: 2 }
  #menu.open { display: block }
  #menu div { padding: 4px 10px 4px 22px; border-radius: 4px; cursor: default; position: relative }
  #menu div:hover { background: rgba(255, 255, 255, 0.09) }
  #menu div.on::before { content: "✓"; position: absolute; left: 7px }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px }
  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.6 }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div class="row">
    <button data-a="undo" title="Undo (⌘Z)"><svg viewBox="0 0 20 20"><path d="M7 4 3 8l4 4"/><path d="M3 8h9a5 5 0 0 1 0 10H9"/></svg></button>
    <button data-a="redo" title="Redo (⇧⌘Z)"><svg viewBox="0 0 20 20"><path d="m13 4 4 4-4 4"/><path d="M17 8H8a5 5 0 0 0 0 10h3"/></svg></button>
    <span class="sep"></span>
    <button data-a="dry" title="Dry… (D)"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg></button>
    <button data-a="clean" title="Clean brush (C)"><svg viewBox="0 0 20 20"><path d="M10 2.5S4.5 9 4.5 12.5a5.5 5.5 0 0 0 11 0C15.5 9 10 2.5 10 2.5z"/></svg></button>
    <button data-a="scrape" title="Scrape palette"><svg viewBox="0 0 20 20"><path d="m8 17 9-9-5-5-9 9 5 5z"/><path d="M8 17h9M5.5 9.5l5 5"/></svg></button>
    <button data-a="handle" title="Show/hide handle (H)"><svg viewBox="0 0 20 20"><path d="M17 3 9.5 10.5"/><path d="M9.5 10.5c-2-1-4.5 0-4.5 2.5 0 1.5-.8 2.5-2 3 3.5 1 7.5 0 7.5-3.5 0-.8-.4-1.5-1-2z"/></svg></button>
    <button data-a="crop" title="Crop canvas"><svg viewBox="0 0 20 20"><path d="M5 2v13h13"/><path d="M2 5h13v13"/></svg></button>
    <button data-a="new" title="New canvas…"><svg viewBox="0 0 20 20"><path d="M11 2.5H5.5v15h9V6z"/><path d="M11 2.5V6h3.5M10 9v6M7 12h6"/></svg></button>
    <span class="sep"></span>
    <button data-a="replay" title="Replay painting (click again or Esc to stop)"><svg viewBox="0 0 20 20"><path d="M6 4v12l10-6z"/></svg></button>
    <button data-a="save" title="Save (⌘S) · Save As (⇧⌘S)"><svg viewBox="0 0 20 20"><path d="M10 3v10M6 9l4 4 4-4M4 16h12"/></svg></button>
    <button data-a="open" title="Open (⌘O)"><svg viewBox="0 0 20 20"><path d="M2.5 5.5v10h15v-8H9.5L8 5.5z"/></svg></button>
    <button data-a="export" title="Export PNG (⌘E)"><svg viewBox="0 0 20 20"><rect x="2.5" y="4" width="15" height="12" rx="1.5"/><path d="m2.5 13 4-4 4 4 2.5-2.5 4.5 4.5"/><circle cx="13" cy="7.5" r="1"/></svg></button>
  </div>
  <div id="dry" class="row">
    <input id="dryHours" type="range" min="0" max="1" step="0.001" value="0.5">
    <span id="dryVal"></span>
    <label><input id="dryPal" type="checkbox">palette too</label>
    <label title="Dried paint loses a little of its gloss"><input id="dryDull" type="checkbox" checked>dulling</label>
    <button id="dryGo">Dry</button>
  </div>
  <div id="status"></div>
</div>
<div id="menu"></div>
<div id="err"></div>
<input id="file" type="file" accept=".pirl" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
